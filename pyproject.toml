[project]
name = "manus-cli"
version = "0.1.0"
description = "CLI para a API do Manus"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
manus = "manus_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manus_cli*"]
