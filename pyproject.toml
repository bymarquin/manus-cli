[project]
name = "manus-cli"
dynamic = ["version"]
description = "CLI para a API do Manus"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pathspec>=0.12,<1",
    "prompt_toolkit>=3.0.43,<4",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "mypy==1.17.1",
    "ruff==0.16.3",
]

[project.scripts]
manus = "manus_cli.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["manus_cli*"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "RUF"]
ignore = [
    "E501",  # line length is handled by the line-length setting, not worth failing CI over
    "RUF001", "RUF002", "RUF003",  # we intentionally use ❯ ✓ ✗ ⚠ etc. as UI glyphs throughout
]

[tool.mypy]
python_version = "3.9"
files = ["manus_cli"]
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
